<!doctype html><html lang="mn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corg.ly санал асуулга</title>
<style>body{font:16px system-ui;background:#f4f6fa;color:#172339;max-width:1000px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}h1{margin-bottom:0}small{color:#55637a}section,article{background:white;border:1px solid #d9e0ed;border-radius:18px;padding:24px;margin:24px 0}input,textarea,button{font:inherit;box-sizing:border-box}input,textarea{width:100%;padding:12px;border:1px solid #9eabc0;border-radius:8px;margin:8px 0 18px}button{background:#244fc4;color:white;border:0;border-radius:8px;padding:11px 17px;cursor:pointer;margin:6px 8px 6px 0}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e9eefb;color:#244fc4}label{display:block}#notice{color:#a11e2d;min-height:24px}progress{width:100%;height:16px}a{color:#244fc4}.option{padding:10px 0;border-top:1px solid #e8ecf2}button:focus-visible,a:focus-visible{outline:3px solid #e6a900}footer{color:#55637a}</style>
<header><div><small>SOFTWARE PROJECT DOCUMENTATION · WEEK 07</small><h1>Corg.ly</h1><p>Асуултаа тавь. Саналаа нэгтгэ.</p></div><span>Санал асуулга</span></header>
<section><h2>Шинэ санал асуулга</h2><p>Асуултаа бичээд хоёр сонголт нэмээрэй.</p><form id="create"><label for="question">Асуулт</label><input id="question" maxlength="200" placeholder="Дараагийн уулзалтыг хэзээ хийх вэ?"><label for="options">Сонголтууд</label><textarea id="options" rows="4" placeholder="Даваа&#10;Мягмар"></textarea><small>Мөр бүрд нэг сонголт бичнэ. Нийт 2–6 сонголт.</small><br><button>Үүсгэх</button></form><p id="notice" role="status" aria-live="polite"></p></section>
<h2>Санал асуулгууд</h2><div id="polls"></div><footer>Сургалтын локал загвар · Нэвтрэлт болон давхар саналын хязгаарлалтгүй.</footer>
<script>
const el=id=>document.getElementById(id);
async function api(path, data){const r=await fetch('/api/polls'+path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await r.json();if(!r.ok)throw new Error(body.error);return body;}
function text(tag,value){const n=document.createElement(tag);n.textContent=value;return n;}
async function action(btn,fn){btn.disabled=true;el('notice').textContent='';try{await fn();}catch(e){el('notice').textContent=e.message;}finally{btn.disabled=false;}}
async function load(){const polls=await api('');el('polls').replaceChildren();if(!polls.length){el('polls').append(text('p','Санал асуулга алга. Эхнийхээ асуулгыг үүсгээрэй.'));return;}for(const p of polls){const a=document.createElement('article');a.id='poll-'+p.id;a.append(text('h3',p.question),text('small','ID: '+p.id+' · Нийт санал: '+p.total_votes));for(const o of p.options){const row=document.createElement('div');row.className='option';const b=text('button',o.label+' · '+o.votes+' санал');b.onclick=()=>action(b,async()=>{await api('/'+p.id+'/votes',{option_id:o.id});await load();el('notice').textContent='Таны саналыг бүртгэлээ.';});const bar=document.createElement('progress');bar.max=p.total_votes||1;bar.value=o.votes;bar.setAttribute('aria-label',o.label+' саналын тоо');row.append(b,bar);a.append(row);}const slack=text('button','Үр дүнг Slack руу илгээх');slack.className='secondary';slack.onclick=()=>action(slack,async()=>{await api('/'+p.id+'/slack',{});el('notice').textContent='Үр дүнг Slack суваг руу илгээлээ.';});a.append(slack);el('polls').append(a);}}
el('create').onsubmit=e=>{e.preventDefault();const b=e.target.querySelector('button');action(b,async()=>{await api('',{question:el('question').value,options:el('options').value.split('\n').map(x=>x.trim()).filter(Boolean)});e.target.reset();await load();el('notice').textContent='Санал асуулга үүслээ. Сонголт дээр дарж саналаа өгнө үү.';});};load().catch(e=>el('notice').textContent=e.message);
</script></html>
